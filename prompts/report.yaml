mcp_tools:
  title: "MCP ツール利用ガイド"
  github_mcp: |
    **GitHub MCP サーバーが利用可能な場合の追加調査手順**:

    GitHub MCP サーバーを使用して、以下の調査を行ってください

    - **GitHub リポジトリの直接調査**:
      - 注目のAI/ML関連リポジトリの最新コミット、Issue、PRを確認
      - [AI技術キーワード] に関連するリポジトリの最新コミット、Issue、PRを確認
      - GitHub Trending から人気急上昇中のAIプロジェクトを取得
      - スター数の多いリポジトリの最新リリースノートを確認

    - **OSS開発動向の詳細調査**:
      - 特定リポジトリのファイル内容を直接読み取り、新機能や変更点を確認
      - Issue/PR の議論内容から技術的な課題や解決策を抽出

    - **企業・組織の活動調査**:
      - OpenAI, Anthropic, Google AI, Microsoft AI 等の公式 GitHub Organization の最新活動を確認
      - 研究機関や大学の GitHub リポジトリから最新研究成果を取得
  huggingface_mcp: |
    **Hugging Face MCP サーバーが利用可能な場合の追加調査手順**:

    Hugging Face MCP サーバーを使用して、以下の調査を行ってください

    - **最新AIモデルの調査**:
      - [AI技術キーワード] に関連する最新のモデルを Hugging Face Model で検索
      - 日本語対応モデル、マルチモーダルモデルなど特定用途のモデルを Hugging Face Model で検索
      - モデルのダウンロード数、いいね数、更新日から人気度を把握

    - **最新データセットの調査**:
      - [AI技術キーワード] に関連する最新の公開データセット、ベンチマークデータセットを Hugging Face Dataset で検索

    - **最新Hugging Face Space の調査**:
      - [AI技術キーワード] に関連する最新のデモアプリケーション、実験的プロジェクトを Hugging Face Space で検索
      - 注目のSpace（スター数、使用状況）から技術トレンドを把握

    - **最新論文・研究動向の調査**:
      - [AI技術キーワード] に関連する最新の研究論文を Hugging Face Paper で検索
      - 論文の概要、先行研究と比べてどこがすごいのか？特定技術領域の論文動向などを確認

report:
  title: "最新AI論文動向調査レポート"
  prompt: |
    あなたは最新のAI論文を調査する専門家です。**Web Search機能・WebFetch機能・MCPサーバーなどを活用して**、以下の情報源を**優先的に**調査し、必要に応じてその他の関連URLも調査して、リアルタイムの情報を提供してください：

    ## 調査手順

    1.**以下サイトの情報源から最新論文を収集**：

      {key_urls}

       - 上記の優先調査対象から最新論文を確認
       - 上記の優先情報源で十分な情報が得られない場合は、その他の関連する情報源も調査してください。

    2. **以下キーワードに関連する最新論文を調査**：

      {key_words}

       - 上記の優先キーワードから関連する最新論文を検索
       - 必要に応じてその他キーワードも調査

    3. **以下MCPサーバーを活用して、より包括的で正確な論文情報を収集**：

      {mcp_tools}

    ## レポート形式
    以下の形式で詳細なレポートを作成してください：

    ## 📊 最新AI論文動向レポート

    ### 🔥 重要ニュース（上位{news_count}件）
    [具体的な論文タイトルと日付、詳細説明、URL付き]

    ### 📈 論文の概要
    [論文の概要、先行研究と比べてどこがすごいのか？]

    ### 🔬 研究者向けポイント
    [論文の技術や手法の"キモ"はどこにある？]

    ### 🔮 今後の展望

    **重要**: 各項目は**簡潔で読みやすい箇条書き**で記述し、冗長な説明は避けてください。{current_year}年の最新リアルタイム情報のみを報告し、各情報には必ず出典URLを記載してください。

