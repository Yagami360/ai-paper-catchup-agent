key_urls:
  title: "主要AI論文情報取得先URL"
  sources: |
    - **【最優先】学術論文サイト**:
      - arXiv（コンピュータサイエンス・AI分野）
        - https://arxiv.org/list/cs.AI/recent （AI全般）
        - https://arxiv.org/list/cs.LG/recent （機械学習）
        - https://arxiv.org/list/cs.CV/recent （コンピュータビジョン）
        - https://arxiv.org/list/cs.CL/recent （自然言語処理）
        - https://arxiv.org/list/cs.RO/recent （ロボティクス）
      - Papers with Code
        - https://paperswithcode.com （トレンド論文・ベンチマーク）
        - https://paperswithcode.com/latest （最新論文）
      - Hugging Face Papers
        - https://huggingface.co/papers （コミュニティ注目論文）
        - https://huggingface.co/papers/trending （トレンド論文）
      - Semantic Scholar
        - https://www.semanticscholar.org （論文検索）
    - **AI企業・研究機関の研究ページ**（論文発表を優先）:
      - OpenAI
        - https://openai.com/research/ （研究論文）
      - Anthropic
        - https://www.anthropic.com/research （研究論文）
      - Google AI Research
        - https://ai.google/research （研究プロジェクト）
        - https://research.google/pubs/ （論文一覧）
      - Google DeepMind
        - https://deepmind.google/research/ （研究論文）
      - Microsoft Research AI
        - https://www.microsoft.com/en-us/research/research-area/artificial-intelligence/ （AI研究）
      - Meta AI Research (FAIR)
        - https://ai.meta.com/research/ （研究論文）
      - NVIDIA Research
        - https://www.nvidia.com/en-us/research/ （研究論文）
        - https://research.nvidia.com （研究プロジェクト）
    - **論文実装コード・モデル**:
      - Hugging Face Models（論文実装モデル）
        - https://huggingface.co/models?sort=trending
        - https://huggingface.co/models?sort=modified （最新更新）
      - GitHub Topics
        - https://github.com/topics/research-paper
        - https://github.com/topics/arxiv
        - https://github.com/topics/machine-learning-research
    - **補足情報源**（論文に関する情報がある場合のみ）:
      - AI技術ニュース（論文発表ニュース）
        - https://techcrunch.com/category/artificial-intelligence
        - https://venturebeat.com/ai
      - AI企業ブログ（論文解説記事）
        - https://openai.com/news/
        - https://www.anthropic.com/news
        - https://blog.google/technology/ai
        - https://blogs.nvidia.com
      - 日本語技術情報（論文解説）
        - https://qiita.com/trend

mcp_tools:
  title: "MCP ツール利用ガイド"
  github_mcp: |
    **GitHub MCP サーバーが利用可能な場合の追加調査手順**:

    GitHub MCP サーバーを使用して、以下の**論文に関連する調査**を行ってください

    - **論文の実装コードの調査**:
      - [AI技術キーワード] に関連する**論文の実装コード**を持つリポジトリを検索
      - READMEに論文リンク（arXiv等）が記載されているリポジトリを優先
      - "paper", "arxiv", "research" などのトピックタグを持つリポジトリを確認
      - 論文著者の公式実装リポジトリを優先

    - **企業・研究機関の論文リポジトリ調査**:
      - OpenAI, Anthropic, Google AI, Microsoft AI, NVIDIA Research 等の公式 GitHub Organization から**論文関連リポジトリ**を確認
      - 研究機関や大学の GitHub リポジトリから**論文の実装コード**を取得
      - リポジトリ名やREADMEに論文タイトルやarXiv IDが含まれるものを優先

    - **論文実装の詳細調査**:
      - 論文実装リポジトリのREADME.mdを読み取り、論文情報（タイトル、著者、arXivリンク）を確認
      - 最新リリースノートから論文関連の更新情報を取得
      - Issue/PR で議論されている技術的な課題や改善点を確認

    - **注意事項**:
      - 論文が明記されていない一般的なツールやアプリケーションは除外
      - 論文の実装コードや研究成果に関連するリポジトリのみを対象
  huggingface_mcp: |
    **Hugging Face MCP サーバーが利用可能な場合の追加調査手順**:

    Hugging Face MCP サーバーを使用して、以下の**論文に特化した調査**を行ってください

    - **最優先: 最新論文の調査**:
      - [AI技術キーワード] に関連する最新の研究論文を Hugging Face Paper で検索
      - 論文の概要、先行研究と比べてどこがすごいのか、技術的な貢献を確認
      - 論文の著者、所属機関、公開日、arXivリンクを記録
      - トレンド論文、コミュニティで注目されている論文を優先

    - **論文に関連するモデルの調査**:
      - [AI技術キーワード] に関連する最新のモデルで、**論文が公開されているもの**を Hugging Face Model で検索
      - モデルカードに論文リンク（arXiv等）が記載されているモデルを優先
      - 論文の実装コードとして公開されているモデルを確認

    - **論文に関連するデータセットの調査**:
      - [AI技術キーワード] に関連する**論文で使用されている**データセット、ベンチマークデータセットを Hugging Face Dataset で検索
      - データセットカードに論文リンクが記載されているデータセットを優先

    - **補足: 論文のデモアプリの調査**:
      - [AI技術キーワード] に関連する**論文の実装デモ**を Hugging Face Space で検索
      - 論文の手法を実装したSpaceを優先
      - ただし、論文が明記されていないデモアプリは除外

report:
  title: "最新AI論文動向調査レポート"
  prompt: |
    あなたは最新のAI論文を調査する専門家です。**Web Search機能・WebFetch機能・MCPサーバーなどを活用して**、以下の**学術論文に特化した情報源を最優先で**調査し、学術論文に焦点を当てたレポートを作成してください：

    ## 調査手順

    1. **以下の情報源から学術論文を収集**（優先度順）：

      {key_urls}

       - 上記の【最優先】学術論文サイトを必ず確認してください
       - 論文タイトル（原題）、著者、所属機関、公開日、論文URL（arXiv等）を必ず記録
       - 実装コードのURL（GitHub等）も確認してください

    2. **以下キーワードに関連する論文を検索**：

      {key_words}

       - 上記キーワードで学術論文サイトを検索
       - 論文の技術的な貢献と先行研究との違いを確認

    3. **MCPサーバーを活用**（利用可能な場合）：

      {mcp_tools}

    ## レポート作成の注意事項
    - **学術論文のみ**を対象とし、一般的なニュース記事やブログは除外してください
    - 各論文について以下の情報を含めてください：
      - 論文タイトル（原題）
      - 著者・所属機関
      - 公開日
      - 論文URL（arXiv、Papers with Code、Hugging Faceなど）
      - 実装コードのURL（GitHub等、存在する場合）
      - 論文の概要と貢献

    ## レポート形式
    以下の Markdown 形式で詳細なレポートを作成してください：

    # 📄 重要論文（上位{news_count}件）
    各論文について以下の形式で記載：

    ## **論文タイトル**

    ### 0. 論文情報・リンク
    - 論文リンク:
    - 公開日時：xxxx/xx/xx
    - 組織:
    - 被引用数（記事作成時点）：xxx 件
    - 実装コードのリンク:
    - ライセンス:
    - Publication:

    ### 1. どんなもの？
    - xxx

    ### 2. 先行研究と比べてどこがすごいの？
    - xxx

    ### 3. 技術や手法の"キモ"はどこにある？
    - xxx

    ### 4. どうやって有効だと検証した？
    - 学習用データセット
    - 実験設定
    - 定性検証
    - 定量検証

    ### 5. 議論はあるか？
    - xxx

    ### 6. 次に読むべき論文はあるか？
    - xxx

    ### 7. 参考文献
    - xxx

    # 📈 論文動向の概要
    - 今週/今月の主要な研究トレンド
    - 注目されている研究分野とテーマ
    - 複数の論文で共通する技術やアプローチ

    # 🔬 研究者向けポイント
    - 各論文の技術的な"キモ"
    - 実装上の重要なポイント
    - 再現性に関する情報（コード公開状況など）

    # 🔮 今後の展望
    - これらの論文が示唆する研究の方向性
    - 実用化に向けた課題と可能性

    **重要**: 
    - **学術論文のみ**を対象としてください
    - 一般的なニュース記事やブログ記事は含めないでください
    - {current_year}年の最新論文のみを報告してください
    - 各論文には必ず論文URL（arXiv、Papers with Codeなど）を記載してください
    - 論文タイトルは原題（英語）で記載してください

